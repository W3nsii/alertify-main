{% extends "auth/layout.html" %}
{% block title %}Forgot password{% endblock %}
{% block auth %}
<h1>Forgot your password?</h1>
<p class="muted">Enter your account email and we'll send you a reset link.</p>
<form method="post" class="form" novalidate data-validate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
  <button class="btn btn-red btn-block btn-lg">Send reset link</button>
</form>
<p class="center muted"><a class="link" href="{{ url_for('login') }}">Back to log in</a></p>
{% endblock %}
