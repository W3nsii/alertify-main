{% extends "auth/layout.html" %}
{% block title %}Create account{% endblock %}
{% block auth %}
<h1>Create your account</h1>
<p class="muted">Save your reports and get barangay-specific announcements.</p>
<form method="post" class="form" novalidate data-validate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field"><span>Full name</span><input name="full_name" required minlength="2" maxlength="120" autocomplete="name" value="{{ form.full_name or '' }}"></label>
  <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email" value="{{ form.email or '' }}"></label>
  <div class="two-col tight">
    <label class="field"><span>Mobile number <em class="muted">(optional)</em></span><input name="phone" autocomplete="tel" maxlength="20" value="{{ form.phone or '' }}"></label>
    <label class="field"><span>Barangay <em class="muted">(optional)</em></span>
      <select name="barangay"><option value="">— Select —</option>{% for b in barangays %}<option {{ 'selected' if form.barangay == b }}>{{ b }}</option>{% endfor %}</select>
    </label>
  </div>
  <label class="field"><span>Password</span><input type="password" name="password" required minlength="8" autocomplete="new-password"><small class="muted">At least 8 characters with letters and numbers.</small></label>
  <label class="field"><span>Confirm password</span><input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
  <button class="btn btn-red btn-block btn-lg">Create account</button>
</form>
<p class="center muted">Already have an account? <a class="link" href="{{ url_for('login', next=request.args.get('next')) }}">Log in</a></p>
{% endblock %}
